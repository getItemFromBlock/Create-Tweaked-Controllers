modLoader = "javafml"
loaderVersion = "${forge_range}"
license = "MIT"
issueTrackerURL = "https://github.com/${github_project}/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${name}"
displayURL="https://github.com/${github_project}"
logoFile = "logo.png"
authors = "${authors}"
description = "${description}"

[[dependencies.create_tweaked_controllers]]
modId = "forge"
mandatory = true
versionRange = "${forge_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.create_tweaked_controllers]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.create_tweaked_controllers]]
modId = "create"
mandatory = true
versionRange = "${create_range}"
ordering = "NONE"
side = "BOTH"