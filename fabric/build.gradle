plugins {
    id "com.github.johnrengelman.shadow" version "${shadow_plugin_version}"
}

architectury {
    platformSetupLoomIde()
    fabric()
}


configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

repositories {
    mavenCentral()
    // mavens for Create Fabric and dependencies
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://mvn.devos.one/snapshots/" } // Create Fabric, Porting Lib, Forge Tags, Milk Lib, Registrate Fabric
    maven { url "https://maven.cafeteria.dev/releases" } // Fake Player API
    maven { url "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // Forge Config API Port
    maven { url "https://maven.jamieswhiteshirt.com/libs-release" } // Reach Entity Attributes
    maven { url "https://jitpack.io/" } // Mixin Extras, Fabric ASM
}

dependencies {
    modImplementation("net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}")
    modApi("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}")
    // Remove the next line if you don't want to depend on the API
    modApi("dev.architectury:architectury-fabric:${rootProject.architectury_version}")


    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }

    modImplementation("com.simibubi.create:create-fabric-${rootProject.minecraft_version}:${rootProject.create_fabric_version}+mc${rootProject.minecraft_version}")

    // CC Restitched
    modRuntimeOnly("maven.modrinth:cc-restitched:${rootProject.cc_restitched_version}+${rootProject.minecraft_version}")

    // Recipe Viewer
    modLocalRuntime("dev.emi:emi:${rootProject.emi_version}+${rootProject.minecraft_version}")
}

processResources {
    inputs.property "mod_id", "${mod_id}"
    inputs.property "version", "${version}"
    inputs.property "name", "${name}"
    inputs.property "description", "${description}"
    inputs.property "authors", "${authors}"
    inputs.property "github_project", "${github_project}"
    inputs.property "fabric_loader_version", "${fabric_loader_version}"
    inputs.property "minecraft_version", "${minecraft_version}"
    inputs.property "architectury_version", "${architectury_version}"

    filesMatching("fabric.mod.json") {
        expand( "mod_id": "${mod_id}",
                "version": "${version}",
                "name": "${name}",
                "description": "${description}",
                "authors": "${authors}",
                "github_project": project.github_project,
                "fabric_loader_version": "${fabric_loader_version}",
                "minecraft_version": "${minecraft_version}",
                "architectury_version": "${architectury_version}"
        )
    }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
            dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
            from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}

